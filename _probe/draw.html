<!doctype html>
<meta charset="utf-8">
<title>draw scan</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
<canvas id="c" width="128" height="128"></canvas>
<script>
  // Minimal-cube test reduced to its irreducible question: does a DRAW land
  // pixels at all? Every clear-only probe passed, which is what hid the failure.
  const q = new URLSearchParams(location.search);
  const version = q.get('v') || '1';
  const c = document.getElementById('c');
  const attrs = { antialias: false };
  let gl = null, ctxErr = null;
  try {
    gl = version === '2' ? c.getContext('webgl2', attrs) : c.getContext('webgl', attrs);
  } catch (e) {
    ctxErr = String(e);
  }
  if (!gl) ctxErr = 'getContext returned null';

  const out = {
    requested: 'webgl' + version,
    ctxErr: null,
    version: null,
    renderer: null,
    vendor: null,
    drawingBuffer: null,
    contextLost: gl ? gl.isContextLost() : null,
    shaderErr: null,
    linkStatus: null,
    attribLoc: null,
    glError: 0,
    pixels: null,
    distinctFromClear: 0,
    samples: null,
    frames: 0,
    lostDuringFrames: false,
    lossFrame: null,
    extensions: null,
  };

  if (gl) {
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    out.version = String(gl.getParameter(gl.VERSION));
    out.renderer = dbg ? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)) : String(gl.getParameter(gl.RENDERER));
    out.vendor = dbg ? String(gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL)) : String(gl.getParameter(gl.VENDOR));
    out.drawingBuffer = [gl.drawingBufferWidth, gl.drawingBufferHeight];
    out.extensions = (gl.getSupportedExtensions() || []).length;

    const N = 16;
    const px = new Uint8Array(N * N * 4);
    const read = () => {
      gl.readPixels(0, 0, N, N, gl.RGBA, gl.UNSIGNED_BYTE, px);
      return gl.getError();
    };

    // 1) clear only — the control, known to work
    gl.viewport(0, 0, 128, 128);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    out.clearPixel = Array.from(px.slice(0, 4));
    out.glError = read();
    out.clearPixel = Array.from(px.slice(0, 4));

    // 2) compile + draw a full-screen triangle in yellow
    const mk = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) out.shaderErr = gl.getShaderInfoLog(s);
      return s;
    };
    const isES3 = version === '2';
    const vsSrc = isES3
      ? '#version 300 es\nin vec2 p;\nvoid main(){ gl_Position = vec4(p, 0.5, 1.0); }'
      : 'attribute vec2 p;\nvoid main(){ gl_Position = vec4(p, 0.5, 1.0); }';
    const fsSrc = isES3
      ? '#version 300 es\nprecision mediump float;\nout vec4 fragColor;\nvoid main(){ fragColor = vec4(1.0, 1.0, 0.0, 1.0); }'
      : 'precision mediump float;\nvoid main(){ gl_FragColor = vec4(1.0, 1.0, 0.0, 1.0); }';
    const vs = mk(gl.VERTEX_SHADER, vsSrc);
    const fs = mk(gl.FRAGMENT_SHADER, fsSrc);
    const pr = gl.createProgram();
    gl.attachShader(pr, vs);
    gl.attachShader(pr, fs);
    gl.linkProgram(pr);
    out.linkStatus = gl.getProgramParameter(pr, gl.LINK_STATUS);
    if (!out.linkStatus) out.shaderErr = out.shaderErr || gl.getProgramInfoLog(pr);
    gl.useProgram(pr);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'p');
    out.attribLoc = loc;
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    gl.viewport(0, 0, 128, 128);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.finish();
    out.drawError = gl.getError();
    out.drawPixel = Array.from(px.slice(0, 4));
    out.glError = read();
    out.drawPixel = Array.from(px.slice(0, 4));

    // Sample a 16x16 grid across the whole surface: count pixels that are NOT
    // the black clear colour — i.e. did the triangle actually cover anything?
    out.samples = [Array.from(px.slice(0, 4)), Array.from(px.slice(64, 68)), Array.from(px.slice(252, 256))];
    let differs = 0;
    for (let i = 0; i < 16 * 16; i++) {
      if (px[i * 4] || px[i * 4 + 1] || px[i * 4 + 2]) differs++;
    }
    out.distinctFromClear = differs;

    // 3) context stability across repeated frames
    let frames = 0;
    const tick = () => {
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      frames++;
      if (gl.isContextLost() && !out.lostDuringFrames) {
        out.lostDuringFrames = true;
        out.lossFrame = frames;
      }
      out.frames = frames;
      if (frames < 180) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    out.contextLostAtStart = gl.isContextLost();
  }
  window.__probe = out;
</script>
