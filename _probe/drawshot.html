<!doctype html><meta charset="utf-8"><title>drawshot</title>
<style>html,body{margin:0;height:100%;background:#000}canvas{display:block;width:100vw;height:100vh}</style>
<canvas id="c" width="640" height="400"></canvas>
<script>
  // Clear-only in the CORNERS, draw a big yellow triangle in the middle.
  // No readPixels anywhere: the goal is to see whether draws reach a
  // screenshot when nothing forces a GPU readback.
  const q = new URLSearchParams(location.search);
  const version = q.get('v') || '1';
  const c = document.getElementById('c');
  const gl = version === '2' ? c.getContext('webgl2', { antialias: false }) : c.getContext('webgl', { antialias: false });
  window.__probe = { ok: !!gl, version: gl ? String(gl.getParameter(gl.VERSION)) : null, frames: 0, lost: false, lossFrame: null };
  if (gl) {
    const isES3 = version === '2';
    const mk = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); return sh; };
    const vs = mk(gl.VERTEX_SHADER, isES3
      ? '#version 300 es\nin vec2 p;\nvoid main(){ gl_Position = vec4(p,0.5,1.0); }'
      : 'attribute vec2 p;\nvoid main(){ gl_Position = vec4(p,0.5,1.0); }');
    const fs = mk(gl.FRAGMENT_SHADER, isES3
      ? '#version 300 es\nprecision mediump float;\nout vec4 o;\nvoid main(){ o = vec4(1.0,1.0,0.0,1.0); }'
      : 'precision mediump float;\nvoid main(){ gl_FragColor = vec4(1.0,1.0,0.0,1.0); }');
    const pr = gl.createProgram();
    gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr); gl.useProgram(pr);
    const b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    (function tick(){
      gl.viewport(0,0,c.width,c.height);
      gl.clearColor(0,0,1,1);      // blue background
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      const p = window.__probe;
      p.frames++;
      if (gl.isContextLost()) { p.lost = true; if (p.lossFrame === null) p.lossFrame = p.frames; }
      requestAnimationFrame(tick);
    })();
  }
</script>
